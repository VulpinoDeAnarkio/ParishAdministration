spring:
  application:
    name: parafia
  datasource:
    url: jdbc:h2:file:./data/parafia;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: Europe/Warsaw
  flyway:
    enabled: true
  thymeleaf:
    cache: false
  messages:
    encoding: UTF-8

server:
  port: 8080
  servlet:
    session:
      timeout: 8h

parafia:
  demo: true
