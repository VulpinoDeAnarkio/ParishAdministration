<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="chrome(tresc)" class="aplikacja">
    <a class="pomin" href="#tresc">Przejdź do treści</a>
    <input id="menu-przelacznik" class="menu-przelacznik" type="checkbox">
    <aside class="boczny">
        <div class="znak">
            <span class="krzyz" aria-hidden="true"></span>
            <div>
                <strong>Lipowa</strong>
                <small>Kościół ewangelicko-augsburski</small>
            </div>
        </div>
        <nav class="menu" aria-label="Moduły kancelarii">
            <a th:href="@{/}" th:classappend="${sciezka == '/'} ? 'aktywny'">Pulpit</a>
            <p class="sekcja-menu">Ludzie</p>
            <a th:href="@{/osoby}" th:classappend="${#strings.startsWith(sciezka, '/osoby')} ? 'aktywny'">Kartoteka</a>
            <a th:href="@{/gospodarstwa}" th:classappend="${#strings.startsWith(sciezka, '/gospodarstwa')} ? 'aktywny'">Gospodarstwa</a>
            <a th:href="@{/ksiegi}" th:classappend="${#strings.startsWith(sciezka, '/ksiegi')} ? 'aktywny'">Księgi</a>
            <a th:href="@{/grupy}" th:classappend="${#strings.startsWith(sciezka, '/grupy')} ? 'aktywny'">Grupy</a>
            <p class="sekcja-menu">Życie parafii</p>
            <a th:href="@{/kalendarz}" th:classappend="${#strings.startsWith(sciezka, '/kalendarz')} ? 'aktywny'">Kalendarz</a>
            <a th:href="@{/nabozenstwa}" th:classappend="${#strings.startsWith(sciezka, '/nabozenstwa')} ? 'aktywny'">Nabożeństwa</a>
            <p class="sekcja-menu">Parafia</p>
            <a th:href="@{/profil}" th:classappend="${#strings.startsWith(sciezka, '/profil')} ? 'aktywny'">Profil parafii</a>
            <a th:if="${jestAdminem}" th:href="@{/uzytkownicy}"
               th:classappend="${#strings.startsWith(sciezka, '/uzytkownicy')} ? 'aktywny'">Użytkownicy</a>
        </nav>
    </aside>
    <div class="obszar">
        <header class="gora">
            <label class="przycisk-menu" for="menu-przelacznik">Menu</label>
            <form class="szukaj-globalnie" th:action="@{/osoby}" method="get">
                <input type="search" name="q" placeholder="Szukaj osoby" aria-label="Szukaj osoby w kartotece">
            </form>
            <div class="konto" th:if="${konto != null}">
                <span>
                    <strong th:text="${konto.imieINazwisko}">Osoba</strong>
                    <small th:text="${konto.rola.etykieta}">Rola</small>
                </span>
                <form th:action="@{/wyloguj}" method="post">
                    <button class="btn cichy" type="submit">Wyloguj</button>
                </form>
            </div>
        </header>
        <div th:replace="${tresc}"></div>
    </div>
</div>
<script th:src="@{/js/parafia.js}"></script>
</body>
</html>
