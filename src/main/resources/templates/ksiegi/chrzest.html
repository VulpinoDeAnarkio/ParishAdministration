<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Chrzest')}"></head>
<body>
<div th:replace="~{fragments/chrome :: chrome(~{::main})}">
    <main id="tresc" class="tresc">
        <div class="naglowek-strony"><h1 th:text="${edycja} ? 'Poprawa chrztu' : 'Nowy chrzest'">Chrzest</h1></div>
        <form class="karta formularz" th:object="${formularz}" method="post" th:action="${edycja} ? @{/ksiegi/chrzty/{id}(id=${identyfikator})} : @{/ksiegi/chrzty}">
            <div class="siatka-formularza">
                <label class="pole szeroki"><span>Osoba</span>
                    <input type="search" data-filtr="osoba-chrzest" placeholder="Filtruj listę" aria-label="Filtruj osoby">
                    <select id="osoba-chrzest" th:field="*{osobaId}">
                        <option value="">Wybierz</option>
                        <option th:each="o : ${osoby}" th:value="${o.id}" th:text="${o.nazwisko + ' ' + o.imie}">osoba</option>
                    </select>
                    <small th:errors="*{osobaId}"></small>
                </label>
                <label class="pole"><span>Data</span><input type="date" th:field="*{dataChrztu}" required><small th:errors="*{dataChrztu}"></small></label>
                <label class="pole"><span>Numer księgi</span><input th:field="*{numerKsiegi}" required><small th:errors="*{numerKsiegi}"></small></label>
                <label class="pole"><span>Miejsce</span><input th:field="*{miejsce}" required><small th:errors="*{miejsce}"></small></label>
                <label class="pole"><span>Duchowny</span><input th:field="*{duchowny}" required><small th:errors="*{duchowny}"></small></label>
                <label class="pole"><span>Rodzic</span><input th:field="*{rodzicPierwszy}"></label>
                <label class="pole"><span>Drugi rodzic</span><input th:field="*{rodzicDrugi}"></label>
                <label class="pole"><span>Chrzestny</span><input th:field="*{chrzestnyPierwszy}"></label>
                <label class="pole"><span>Drugi chrzestny</span><input th:field="*{chrzestnyDrugi}"></label>
                <label class="pole szeroki"><span>Uwagi</span><textarea th:field="*{uwagi}" rows="3"></textarea></label>
            </div>
            <div class="pasek-akcji"><button class="btn podstawowy" type="submit">Zapisz</button><a class="btn drugi" th:href="@{/ksiegi}">Anuluj</a></div>
        </form>
    </main>
</div>
</body>
</html>
