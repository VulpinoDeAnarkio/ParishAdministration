<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Pogrzeb')}"></head>
<body>
<div th:replace="~{fragments/chrome :: chrome(~{::main})}">
    <main id="tresc" class="tresc">
        <div class="naglowek-strony"><h1>Pogrzeb</h1><p>Zapis oznacza osobę w kartotece jako zmarłą.</p></div>
        <form class="karta formularz" th:object="${formularz}" method="post" th:action="${edycja} ? @{/ksiegi/pogrzeby/{id}(id=${identyfikator})} : @{/ksiegi/pogrzeby}">
            <div class="siatka-formularza">
                <label class="pole szeroki"><span>Osoba</span>
                    <select th:field="*{osobaId}">
                        <option value="">Wybierz</option>
                        <option th:each="o : ${osoby}" th:value="${o.id}" th:text="${o.nazwisko + ' ' + o.imie}">osoba</option>
                    </select>
                    <small th:errors="*{osobaId}"></small>
                </label>
                <label class="pole"><span>Data zgonu</span><input type="date" th:field="*{dataZgonu}" required><small th:errors="*{dataZgonu}"></small></label>
                <label class="pole"><span>Data pogrzebu</span><input type="date" th:field="*{dataPogrzebu}"></label>
                <label class="pole"><span>Numer księgi</span><input th:field="*{numerKsiegi}" required></label>
                <label class="pole"><span>Miejsce</span><input th:field="*{miejsce}" required></label>
                <label class="pole"><span>Cmentarz</span><input th:field="*{cmentarz}"></label>
                <label class="pole"><span>Duchowny</span><input th:field="*{duchowny}" required></label>
                <label class="pole szeroki"><span>Uwagi</span><textarea th:field="*{uwagi}" rows="3"></textarea></label>
            </div>
            <div class="pasek-akcji"><button class="btn podstawowy" type="submit">Zapisz</button><a class="btn drugi" th:href="@{/ksiegi}">Anuluj</a></div>
        </form>
    </main>
</div>
</body>
</html>
