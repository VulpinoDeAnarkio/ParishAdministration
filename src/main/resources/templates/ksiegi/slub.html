<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Ślub')}"></head>
<body>
<div th:replace="~{fragments/chrome :: chrome(~{::main})}">
    <main id="tresc" class="tresc">
        <div class="naglowek-strony"><h1>Ślub</h1><p>Obie osoby muszą mieć ukończone 18 lat, jeśli data urodzenia jest w kartotece.</p></div>
        <form class="karta formularz" th:object="${formularz}" method="post" th:action="${edycja} ? @{/ksiegi/sluby/{id}(id=${identyfikator})} : @{/ksiegi/sluby}">
            <div class="siatka-formularza">
                <label class="pole"><span>Osoba</span>
                    <select th:field="*{osobaAId}">
                        <option value="">Wybierz</option>
                        <option th:each="o : ${osoby}" th:value="${o.id}" th:text="${o.nazwisko + ' ' + o.imie}">osoba</option>
                    </select>
                    <small th:errors="*{osobaAId}"></small>
                </label>
                <label class="pole"><span>Druga osoba</span>
                    <select th:field="*{osobaBId}">
                        <option value="">Wybierz</option>
                        <option th:each="o : ${osoby}" th:value="${o.id}" th:text="${o.nazwisko + ' ' + o.imie}">osoba</option>
                    </select>
                    <small th:errors="*{osobaBId}"></small>
                </label>
                <label class="pole"><span>Data</span><input type="date" th:field="*{dataSlubu}" required><small th:errors="*{dataSlubu}"></small></label>
                <label class="pole"><span>Rodzaj</span>
                    <select th:field="*{rodzaj}">
                        <option th:each="r : ${rodzaje}" th:value="${r}" th:text="${r.etykieta}">rodzaj</option>
                    </select>
                </label>
                <label class="pole"><span>Numer księgi</span><input th:field="*{numerKsiegi}" required></label>
                <label class="pole"><span>Miejsce</span><input th:field="*{miejsce}" required></label>
                <label class="pole"><span>Duchowny</span><input th:field="*{duchowny}" required></label>
                <label class="pole"><span>Świadek</span><input th:field="*{swiadekPierwszy}"></label>
                <label class="pole"><span>Drugi świadek</span><input th:field="*{swiadekDrugi}"></label>
                <label class="pole szeroki"><span>Uwagi</span><textarea th:field="*{uwagi}" rows="3"></textarea></label>
            </div>
            <div class="pasek-akcji"><button class="btn podstawowy" type="submit">Zapisz</button><a class="btn drugi" th:href="@{/ksiegi}">Anuluj</a></div>
        </form>
    </main>
</div>
</body>
</html>
