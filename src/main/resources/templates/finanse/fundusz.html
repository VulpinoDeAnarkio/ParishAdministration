<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Fundusz')}"></head>
<body>
<div th:replace="~{fragments/chrome :: chrome(~{::main})}">
    <main id="tresc" class="tresc">
        <div class="naglowek-strony"><h1>Nowy fundusz</h1></div>
        <form class="karta formularz" th:object="${formularz}" th:action="@{/finanse/fundusze}" method="post">
            <div class="siatka-formularza">
                <label class="pole"><span>Nazwa</span><input th:field="*{nazwa}" required><small th:errors="*{nazwa}"></small></label>
                <label class="pole"><span>Aktywny</span><input type="checkbox" th:field="*{aktywny}"></label>
                <label class="pole szeroki"><span>Opis</span><textarea th:field="*{opis}" rows="3"></textarea></label>
            </div>
            <div class="pasek-akcji"><button class="btn podstawowy" type="submit">Zapisz</button><a class="btn drugi" th:href="@{/finanse}">Anuluj</a></div>
        </form>
    </main>
</div>
</body>
</html>
