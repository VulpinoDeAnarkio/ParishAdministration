<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Operacja')}"></head>
<body>
<div th:replace="~{fragments/chrome :: chrome(~{::main})}">
    <main id="tresc" class="tresc">
        <div class="naglowek-strony"><h1>Nowa operacja</h1></div>
        <form class="karta formularz" th:object="${formularz}" th:action="@{/finanse/operacje}" method="post">
            <div class="siatka-formularza">
                <label class="pole"><span>Fundusz</span>
                    <select th:field="*{funduszId}" required>
                        <option value="">Wybierz</option>
                        <option th:each="s : ${fundusze}" th:value="${s.fundusz.id}" th:text="${s.fundusz.nazwa}" th:disabled="${!s.fundusz.aktywny}">fundusz</option>
                    </select>
                    <small th:errors="*{funduszId}"></small>
                </label>
                <label class="pole"><span>Rodzaj</span>
                    <select th:field="*{rodzaj}">
                        <option th:each="r : ${rodzaje}" th:value="${r}" th:text="${r.etykieta}">rodzaj</option>
                    </select>
                </label>
                <label class="pole"><span>Kwota (zł)</span><input type="number" step="0.01" min="0.01" th:field="*{kwota}" required><small th:errors="*{kwota}"></small></label>
                <label class="pole"><span>Data</span><input type="date" th:field="*{dataOperacji}" required></label>
                <label class="pole"><span>Kontrahent</span><input th:field="*{kontrahent}"></label>
                <label class="pole"><span>Osoba (wymagana przy składce)</span>
                    <select th:field="*{osobaId}">
                        <option value="">Bez osoby</option>
                        <option th:each="o : ${osoby}" th:value="${o.id}" th:text="${o.imieINazwisko}">osoba</option>
                    </select>
                </label>
                <label class="pole szeroki"><span>Opis</span><input th:field="*{opis}"></label>
            </div>
            <div class="pasek-akcji"><button class="btn podstawowy" type="submit">Zapisz</button><a class="btn drugi" th:href="@{/finanse}">Anuluj</a></div>
        </form>
    </main>
</div>
</body>
</html>
