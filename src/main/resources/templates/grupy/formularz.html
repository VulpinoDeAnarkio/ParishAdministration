<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Grupa')}"></head>
<body>
<div th:replace="~{fragments/chrome :: chrome(~{::main})}">
    <main id="tresc" class="tresc">
        <div class="naglowek-strony"><h1 th:text="${edycja} ? 'Edycja grupy' : 'Nowa grupa'">Grupa</h1></div>
        <form class="karta formularz" th:object="${formularz}" method="post" th:action="${edycja} ? @{/grupy/{id}(id=${identyfikator})} : @{/grupy}">
            <div class="siatka-formularza">
                <label class="pole"><span>Nazwa</span><input th:field="*{nazwa}" required><small th:errors="*{nazwa}"></small></label>
                <label class="pole"><span>Rodzaj</span>
                    <select th:field="*{rodzaj}">
                        <option th:each="r : ${rodzaje}" th:value="${r}" th:text="${r.etykieta}">rodzaj</option>
                    </select>
                </label>
                <label class="pole"><span>Termin spotkań</span><input th:field="*{termin}" placeholder="np. czwartek 18:00"></label>
                <label class="pole"><span>Miejsce</span><input th:field="*{miejsce}"></label>
                <label class="pole"><span>Prowadzący</span>
                    <select th:field="*{liderId}">
                        <option value="">Nie wskazano</option>
                        <option th:each="o : ${osoby}" th:value="${o.id}" th:text="${o.nazwisko + ' ' + o.imie}">osoba</option>
                    </select>
                </label>
                <label class="pole"><span>Grupa aktywna</span><input type="checkbox" th:field="*{aktywna}"></label>
                <label class="pole szeroki"><span>Opis</span><textarea th:field="*{opis}" rows="4"></textarea></label>
            </div>
            <div class="pasek-akcji"><button class="btn podstawowy" type="submit">Zapisz</button><a class="btn drugi" th:href="@{/grupy}">Anuluj</a></div>
        </form>
    </main>
</div>
</body>
</html>
