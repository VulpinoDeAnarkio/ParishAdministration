<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${edycja} ? 'Edycja osoby' : 'Nowa osoba')}"></head>
<body>
<div th:replace="~{fragments/chrome :: chrome(~{::main})}">
    <main id="tresc" class="tresc">
        <div th:replace="~{fragments/komunikaty :: komunikaty}"></div>
        <div class="naglowek-strony">
            <div>
                <h1 th:text="${edycja} ? 'Edycja kartoteki' : 'Nowa osoba'">Osoba</h1>
                <p>Puste pole adresu przy wybranym gospodarstwie przepisze adres domu.</p>
            </div>
        </div>
        <form class="karta formularz" th:object="${formularz}" method="post"
              th:action="${edycja} ? @{/osoby/{id}(id=${identyfikator})} : @{/osoby}">
            <h2>Tożsamość</h2>
            <div class="siatka-formularza">
                <label class="pole"><span>Imię</span><input th:field="*{imie}" required><small th:errors="*{imie}"></small></label>
                <label class="pole"><span>Drugie imię</span><input th:field="*{drugieImie}"></label>
                <label class="pole"><span>Nazwisko</span><input th:field="*{nazwisko}" required><small th:errors="*{nazwisko}"></small></label>
                <label class="pole"><span>Nazwisko rodowe</span><input th:field="*{nazwiskoRodowe}"></label>
                <label class="pole">
                    <span>Płeć</span>
                    <select th:field="*{plec}">
                        <option th:each="p : ${plcie}" th:value="${p}" th:text="${p.etykieta}">płeć</option>
                    </select>
                </label>
                <label class="pole"><span>Data urodzenia</span><input type="date" th:field="*{dataUrodzenia}"><small th:errors="*{dataUrodzenia}"></small></label>
                <label class="pole szeroki"><span>Miejsce urodzenia</span><input th:field="*{miejsceUrodzenia}"></label>
            </div>
            <h2>Kontakt</h2>
            <div class="siatka-formularza">
                <label class="pole"><span>E-mail</span><input type="email" th:field="*{email}"><small th:errors="*{email}"></small></label>
                <label class="pole"><span>Telefon</span><input th:field="*{telefon}"></label>
                <label class="pole szeroki"><span>Ulica</span><input th:field="*{ulica}"></label>
                <label class="pole waski"><span>Kod</span><input th:field="*{kodPocztowy}"></label>
                <label class="pole"><span>Miejscowość</span><input th:field="*{miejscowosc}"></label>
                <label class="pole">
                    <span>Zgoda na kontakt</span>
                    <input type="checkbox" th:field="*{zgodaNaKontakt}">
                </label>
            </div>
            <h2>Członkostwo</h2>
            <div class="siatka-formularza">
                <label class="pole">
                    <span>Status</span>
                    <select th:field="*{status}">
                        <option th:each="s : ${statusy}" th:value="${s}" th:text="${s.etykieta}">status</option>
                    </select>
                </label>
                <label class="pole">
                    <span>Gospodarstwo</span>
                    <select th:field="*{gospodarstwoId}">
                        <option value="">Poza gospodarstwem</option>
                        <option th:each="g : ${gospodarstwa}" th:value="${g.id}" th:text="${g.nazwa}">dom</option>
                    </select>
                </label>
                <label class="pole">
                    <span>Rola w rodzinie</span>
                    <select th:field="*{rolaWRodzinie}">
                        <option value="">Nieokreślona</option>
                        <option th:each="r : ${roleWRodzinie}" th:value="${r}" th:text="${r.etykieta}">rola</option>
                    </select>
                </label>
                <label class="pole"><span>Data przyjęcia</span><input type="date" th:field="*{dataPrzyjecia}"></label>
                <label class="pole"><span>Data wystąpienia lub zgonu</span><input type="date" th:field="*{dataWystapienia}"></label>
                <label class="pole">
                    <span>Uczestniczy w Wieczerzy Pańskiej</span>
                    <input type="checkbox" th:field="*{uczestniczyWWieczerzy}">
                </label>
                <label class="pole szeroki"><span>Uwagi kancelarii</span><textarea th:field="*{uwagi}" rows="4"></textarea></label>
            </div>
            <div class="pasek-akcji">
                <button class="btn podstawowy" type="submit">Zapisz</button>
                <a class="btn drugi" th:href="@{/osoby}">Anuluj</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
