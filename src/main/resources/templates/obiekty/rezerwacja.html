<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Rezerwacja')}"></head>
<body>
<div th:replace="~{fragments/chrome :: chrome(~{::main})}">
    <main id="tresc" class="tresc">
        <div class="naglowek-strony"><h1>Popraw rezerwację</h1></div>
        <form class="karta formularz" th:object="${formularz}" method="post" th:action="@{/obiekty/rezerwacje/{id}(id=${identyfikator})}">
            <div class="siatka-formularza">
                <label class="pole szeroki"><span>Obiekt</span>
                    <select th:field="*{obiektId}">
                        <option th:each="o : ${obiekty}" th:value="${o.id}" th:text="${o.nazwaZRodzicem}">obiekt</option>
                    </select>
                    <small th:errors="*{obiektId}"></small>
                </label>
                <label class="pole"><span>Od</span><input type="datetime-local" th:field="*{poczatek}" required><small th:errors="*{poczatek}"></small></label>
                <label class="pole"><span>Do</span><input type="datetime-local" th:field="*{koniec}" required><small th:errors="*{koniec}"></small></label>
                <label class="pole"><span>Rezerwujący</span><input th:field="*{rezerwujacy}" required><small th:errors="*{rezerwujacy}"></small></label>
                <label class="pole"><span>Osoba z kartoteki</span>
                    <select th:field="*{osobaId}">
                        <option value="">Gość spoza kartoteki</option>
                        <option th:each="o : ${osoby}" th:value="${o.id}" th:text="${o.nazwisko + ' ' + o.imie}">osoba</option>
                    </select>
                </label>
                <label class="pole"><span>Cel</span><input th:field="*{cel}"></label>
                <label class="pole"><span>Liczba osób</span><input type="number" min="1" th:field="*{liczbaOsob}"><small th:errors="*{liczbaOsob}"></small></label>
                <label class="pole szeroki"><span>Uwagi</span><textarea th:field="*{uwagi}" rows="3"></textarea></label>
            </div>
            <div class="pasek-akcji">
                <button class="btn podstawowy" type="submit">Zapisz</button>
                <a class="btn drugi" th:href="@{/obiekty/{id}(id=*{obiektId})}">Anuluj</a>
            </div>
        </form>
    </main>
</div>
</body>
</html>
