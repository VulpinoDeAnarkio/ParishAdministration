<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Zadanie')}"></head>
<body>
<div th:replace="~{fragments/chrome :: chrome(~{::main})}">
    <main id="tresc" class="tresc">
        <div class="naglowek-strony"><h1>Nowe zadanie</h1></div>
        <form class="karta formularz" th:object="${formularz}" th:action="@{/sluzba/zadania}" method="post">
            <div class="siatka-formularza">
                <label class="pole szeroki"><span>Tytuł</span><input th:field="*{tytul}" required></label>
                <label class="pole"><span>Termin</span><input type="date" th:field="*{termin}"></label>
                <label class="pole"><span>Status</span>
                    <select th:field="*{status}">
                        <option th:each="s : ${statusy}" th:value="${s}" th:text="${s.etykieta}">status</option>
                    </select>
                </label>
                <label class="pole szeroki"><span>Osoba odpowiedzialna</span>
                    <select th:field="*{osobaId}">
                        <option value="">Nieprzypisane</option>
                        <option th:each="o : ${osoby}" th:value="${o.id}" th:text="${o.imieINazwisko}">osoba</option>
                    </select>
                </label>
                <label class="pole szeroki"><span>Opis</span><textarea th:field="*{opis}" rows="4"></textarea></label>
            </div>
            <div class="pasek-akcji"><button class="btn podstawowy" type="submit">Zapisz</button><a class="btn drugi" th:href="@{/sluzba}">Anuluj</a></div>
        </form>
    </main>
</div>
</body>
</html>
